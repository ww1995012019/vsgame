<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人物动作预览 · 街头对决</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e181d;color:#e6ece3;font:14px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:28px}a{color:#ffd449;text-decoration:none}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:25px;margin:5px 0}p{color:#9fb3b7;line-height:1.8;margin:8px 0 22px}.eyebrow{font-size:10px;letter-spacing:3px;color:#67deed}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:17px;background:#17282e;border:1px solid #365259}button,select{font:inherit;background:#20383e;color:#e6ece3;border:1px solid #527079;padding:9px 14px;cursor:pointer}button.active,button:hover{border-color:#ffd449;color:#ffd449}.controls label{display:flex;gap:8px;align-items:center;margin-left:8px}.views{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.card{border:1px solid #365259;background:#13252e}.name{display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #365259}.name b{font-size:18px}.phase{color:#7bdce5;font-size:12px}.view{position:relative;height:450px;overflow:hidden;background:radial-gradient(ellipse at center,#254754,#12242d 75%)}.view>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.timeline{display:flex;align-items:center;gap:15px}.timeline input{flex:1;accent-color:#ffce36}.timeline output{font-variant-numeric:tabular-nums;min-width:100px;color:#c6d7d3}.hint{font-size:12px;color:#96adae}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd449;outline-offset:3px}@media(max-width:750px){main{padding:16px}.views{grid-template-columns:1fr}.view{height:420px}header{align-items:flex-start}h1{font-size:22px}.controls{padding:12px}.controls label{margin:0}.timeline{gap:8px}}
</style></head>
<body><main><header><div><span class="eyebrow">STREET DUEL / MOTION PREVIEW</span><h1>人物动作预览</h1></div><a href="../">返回游戏 →</a></header>
<p>查看两个原画角色的行走、跳跃与近身技能。支持慢放、暂停、逐帧和骨骼显示。</p>
<div class="controls"><button data-action="forward" class="active">前进</button><button data-action="backward">后退</button><button data-action="jump">原地跳跃</button><button data-action="jumpForward">向前跳跃</button><button data-action="skill">近身技能</button><label>速度 <select id="speed"><option value="1">1 倍</option><option value="0.5">0.5 倍</option><option value="0.25">0.25 倍</option></select></label><label><input id="bones" type="checkbox">显示骨骼</label></div>
<div class="views"><section class="card"><div class="name"><b>烈影</b><span class="phase" id="lieying-phase">待机</span></div><div class="view"><canvas id="lieying-view"></canvas></div></section><section class="card"><div class="name"><b>寒锋</b><span class="phase" id="hanfeng-phase">待机</span></div><div class="view"><canvas id="hanfeng-view"></canvas></div></section></div>
<div class="timeline"><button id="play">暂停</button><button id="step">下一帧</button><input id="seek" type="range" min="0" max="1400" step="1" value="0" aria-label="动作时间"><output id="time">0.000 / 1.400 s</output></div><p class="hint">拖动时间条查看起跳、收腿和落地；「下一帧」每次推进 1/60 秒。</p>
</main>
<script type="module">
import {Game} from '../src/engine.js';
import {originalPoseFor,drawSkinBones} from '../src/rig.js';
import {OriginalSkin,CharacterLayer} from '../src/skin.js';
let action='forward',playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,time=0,accumulator=0;
const panels=[];
function reset(){time=0;accumulator=0;for(const p of panels){p.game=new Game();p.game.start({training:true,playerId:p.id});p.game.fighters[0].x=action==='backward'?920:400;p.game.fighters[1].x=1450;if(action==='forward'||action==='jumpForward')p.game.setInput('right',true);if(action==='backward')p.game.setInput('left',true);if(action==='jump'||action==='jumpForward')p.game.setInput('jump',true);if(action==='skill')p.game.setInput('skill',true);}}
function advance(dt){for(const p of panels)p.game.update(dt);time+=dt;}
function draw(){for(const p of panels){
 const c=p.canvas,box=c.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1),w=Math.round(box.width*dpr),h=Math.round(box.height*dpr);if(c.width!==w||c.height!==h){c.width=w;c.height=h;p.layer?.resize(w,h);}
 const ctx=p.ctx;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,box.width,box.height);p.layer?.clear();
 const scale=Math.min(box.width/1300,(box.height-30)/810),floor=box.height-24,left=(box.width-1300*scale)/2;
 ctx.strokeStyle='#62878166';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(8,floor);ctx.lineTo(box.width-8,floor);ctx.stroke();
 for(let x=0;x<=1300;x+=100){ctx.beginPath();ctx.moveTo(left+x*scale,floor-4);ctx.lineTo(left+x*scale,floor+4);ctx.stroke();}
 const f=p.game.fighters[0],pose=originalPoseFor(f,p.game.elapsed);ctx.save();ctx.translate(left+f.x*scale,floor-f.y*scale);ctx.scale(scale*f.facing,scale);
 if(p.layer)p.layer.draw(p.skin,pose,ctx.getTransform());else{p.skin.render(pose);ctx.drawImage(p.skin.canvas,-400,-640);}if(document.querySelector('#bones').checked)drawSkinBones(ctx,pose);ctx.restore();
 const names={idle:'待机',walk:'迈步',prepare:'起跳预备',rise:'上升',apex:'腾空收腿',fall:'下落',land:'落地缓冲'};document.getElementById(p.id+'-phase').textContent=f.attack?'技能动作':names[pose.motion?.phase]||'待机';
 }document.querySelector('#seek').value=time*1000;document.querySelector('#time').value=time.toFixed(3)+' / 1.400 s';document.querySelector('#play').textContent=playing?'暂停':'播放';}
for(const id of ['lieying','hanfeng']){const image=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src='./assets/'+id+'.png';});const canvas=document.getElementById(id+'-view'),candidate=new CharacterLayer(canvas),layer=candidate.gl?candidate:null;panels.push({id,canvas,ctx:canvas.getContext('2d'),layer,skin:new OriginalSkin(image,id,{layer})});}
reset();draw();
function seek(value){playing=false;reset();const ticks=Math.round(value*120);for(let i=0;i<ticks;i++)advance(1/120);draw();}
document.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>{action=button.dataset.action;document.querySelectorAll('[data-action]').forEach(b=>b.classList.toggle('active',b===button));reset();draw();});
document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
document.querySelector('#bones').onchange=draw;
document.querySelector('#play').onclick=()=>{playing=!playing;draw();};
document.querySelector('#step').onclick=()=>{playing=false;if(time>=1.4)reset();advance(1/120);advance(1/120);draw();};
document.querySelector('#seek').oninput=e=>{playing=false;seek(Number(e.target.value)/1000);};
window.motionReview={panels,seek,setAction(name){action=name;reset();draw();}};
let previous=performance.now();function frame(now){const dt=Math.min(.1,(now-previous)/1000);previous=now;if(playing){accumulator+=dt*speed;while(accumulator>=1/120){advance(1/120);accumulator-=1/120;if(time>=1.4)reset();}draw();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
